name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-north-1' }}
  PYTHON_VERSION: "3.11"

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check agent/ evaluation/ tests/


  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: pytest tests/unit -v --cov=agent --cov=evaluation --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7


  test-integration:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: pytest tests/integration
        run: pytest tests/integration -q


  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install bandit[toml]

      - run: bandit -r agent/ evaluation/ -f json -o bandit-report.json || true

      - run: bandit -r agent/ evaluation/ -ll

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json


  pip_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install pip-audit

      - run: pip-audit -r requirements.txt


  tfsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/
          soft_fail: false
          additional_args: --minimum-severity HIGH


  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          quiet: true
          skip_check: CKV_SECRET_2,CKV_SECRET_6
          soft_fail: true


  sonarcloud:
    runs-on: ubuntu-latest
    needs: [unit_tests]
    # Analyse ignorée proprement si le secret SONAR_TOKEN n'est pas configuré
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

        with:
          args: >
            -Dsonar.projectKey=eyaothmani_agent_devops
            -Dsonar.organization=eyaothmani-1
            -Dsonar.sources=agent,evaluation
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml

